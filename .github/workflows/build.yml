name: Build portable Windows patcher
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
concurrency:
  # Keep main/release runs serialized, but never queue unrelated PRs behind them.
  group: ${{ github.event_name == 'pull_request' && format('horizon-patcher-pr-{0}', github.event.pull_request.number) || 'horizon-patcher-release' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      publish: ${{ steps.prepare.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTFLAGS: '-C target-feature=+crt-static'
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Find official release and skip existing build
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh release list --repo horizon-rust/horizon --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list upstream releases' }
          $selected = $releases | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -match '^launcher@[0-9]+\.[0-9]+\.[0-9]+$' } | Select-Object -First 1
          if (-not $selected) { throw 'No official launcher release found' }
          $tag = $selected.tagName
          $version = $tag.Substring('launcher@'.Length)
          $buildTag = 'patcher-' + $version + '-' + $env:GITHUB_SHA.Substring(0,8)
          "UPSTREAM_TAG=$tag" >> $env:GITHUB_ENV
          "HORIZON_LAUNCHER_TAG=$tag" >> $env:GITHUB_ENV
          "HORIZON_LAUNCHER_VERSION=$version" >> $env:GITHUB_ENV
          "PATCHER_BUILD_TAG=$buildTag" >> $env:GITHUB_ENV
          "release_tag=$buildTag" >> $env:GITHUB_OUTPUT
          gh release view $buildTag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { 'publish=false' >> $env:GITHUB_OUTPUT } else { 'publish=true' >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0
      - name: Fetch source and official assets
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch $env:UPSTREAM_TAG https://github.com/horizon-rust/horizon.git upstream
          if ($LASTEXITCODE -ne 0) { throw 'Official source download failed' }
          "UPSTREAM_COMMIT=$(git -C upstream rev-parse HEAD)" >> $env:GITHUB_ENV
          New-Item -ItemType Directory release-assets | Out-Null
          gh release download $env:UPSTREAM_TAG --repo horizon-rust/horizon --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Official release asset download failed' }
      - name: Verify upstream signature and archive hashes
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          $dir = (Resolve-Path release-assets).Path
          cargo run --release --locked --manifest-path upstream/Cargo.toml -p horizon-release-sign -- verify --tag $env:UPSTREAM_TAG $dir
          if ($LASTEXITCODE -ne 0) { throw 'Upstream signature or checksum verification failed' }
          Expand-Archive release-assets/horizon-launcher-windows-x64.zip -DestinationPath official
          $sha = (Get-FileHash official/horizon-launcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "OFFICIAL_SHA256=$sha" >> $env:GITHUB_ENV
      - name: Apply source patch safely
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_apply_patch.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Patch adaptation tests failed' }
          $base = (Get-Content patches/privacy.base -Raw).Trim()
          python tests/apply_patch.py upstream patches/privacy.patch $base
          if ($LASTEXITCODE -ne 0) { throw 'Automatic patch adaptation failed: manual review required' }
      - name: Validate and update translations for the privacy patch
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_prune_translations.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Translation script tests failed' }
          python tests/prune_translations.py upstream/launcher/lang
          if ($LASTEXITCODE -ne 0) { throw 'Could not update translations safely' }
      - name: Check partner banners are absent
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: ./tests/no-partner.ps1 -Source upstream/launcher/src
      - name: Compute launcher cache key
        if: steps.prepare.outputs.publish == 'true'
        id: launcher-key
        shell: pwsh
        run: |
          $bytes = [Text.Encoding]::UTF8.GetBytes("$(rustc -Vv)`n$env:HORIZON_MSA_CLIENT_ID`n$env:RUSTFLAGS")
          $sha = [Security.Cryptography.SHA256]::Create()
          $key = [BitConverter]::ToString($sha.ComputeHash($bytes)).Replace('-', '').ToLowerInvariant()
          "hash=$key" >> $env:GITHUB_OUTPUT
      - name: Restore tested launcher cache
        if: steps.prepare.outputs.publish == 'true'
        id: launcher-cache
        uses: actions/cache/restore@v4
        with:
          path: cached-launcher/horizon-launcher.exe
          key: launcher-v2-${{ env.UPSTREAM_COMMIT }}-${{ env.OFFICIAL_SHA256 }}-${{ hashFiles('patches/privacy.patch', 'patches/privacy.base', 'tests/apply_patch.py', 'tests/test_apply_patch.py', 'tests/prune_translations.py') }}-${{ steps.launcher-key.outputs.hash }}
      # Cache compiled third-party/path dependencies independently of the exact
      # launcher payload. A changed patch still rebuilds and runs all tests.
      # PRs may read trusted main caches but never populate main's cache.
      - name: Restore Cargo dependency cache
        if: steps.prepare.outputs.publish == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: upstream/launcher -> target
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST HORIZON_MSA_CLIENT_ID
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.launcher-cache.outputs.cache-hit != 'true' }}
      - name: Test and build launcher
        if: steps.prepare.outputs.publish == 'true' && steps.launcher-cache.outputs.cache-hit != 'true'
        working-directory: upstream/launcher
        shell: pwsh
        run: |
          # Run every launcher test target once, as upstream does. Separate Cargo
          # invocations can recompile unchanged crates repeatedly on Windows.
          # Check the output too: Cargo succeeds if a required test disappears.
          $requiredTests = @(
            'elyprism_windows_instances_are_discovered',
            'the_developer_option_plays_offline_names_without_an_owner',
            'offline_player_has_stable_vanilla_identity',
            'offline_import_copies_only_verified_existing_files',
            'offline_java_uses_legacy_user_type',
            'mojang_downloads_only_for_an_owner',
            'the_cli_requires_a_prepared_version_for_offline_play',
            'the_mcp_server_requires_a_prepared_version_for_offline_play'
          )
          cargo test --release --locked --no-fail-fast -- --color never | Tee-Object -Variable testOutput
          if ($LASTEXITCODE -ne 0) { throw 'Launcher test suite failed' }
          foreach ($test in $requiredTests) {
            $pattern = '^test\s+(?:[^\s]*::)?' + [regex]::Escape($test) + '\s+\.\.\.\s+ok\s*$'
            $found = @($testOutput | Where-Object { $_ -match $pattern })
            if ($found.Count -lt 1) { throw "Required test $test did not run successfully" }
          }
          cargo build --release --locked --bin horizon-launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          New-Item -ItemType Directory -Force ../../cached-launcher | Out-Null
          Copy-Item target/release/horizon-launcher.exe ../../cached-launcher/horizon-launcher.exe
      - name: Select verified launcher payload
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          $payload = (Resolve-Path cached-launcher/horizon-launcher.exe).Path
          $sha = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          $compressed = Join-Path $env:RUNNER_TEMP 'horizon-payload.gz'
          $inputStream = [IO.File]::OpenRead($payload)
          $outputStream = [IO.File]::Create($compressed)
          $gzip = [IO.Compression.GZipStream]::new($outputStream, [IO.Compression.CompressionLevel]::Optimal)
          try { $inputStream.CopyTo($gzip) } finally { $gzip.Dispose(); $outputStream.Dispose(); $inputStream.Dispose() }
          "PATCH_PAYLOAD=$compressed" >> $env:GITHUB_ENV
          "PATCH_PAYLOAD_SHA256=$sha" >> $env:GITHUB_ENV
          "UNCOMPRESSED_PAYLOAD=$payload" >> $env:GITHUB_ENV
          Write-Host "Compressed launcher: $((Get-Item $payload).Length) -> $((Get-Item $compressed).Length) bytes"
      - name: Test and build the portable patcher
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Patcher tests failed' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Patcher build failed' }
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/horizon-patcher.exe dist/HorizonPatcher.exe
      - name: Smoke test safe replacement with temporary fixtures
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory test-home, test-install | Out-Null
          $env:LOCALAPPDATA = (Resolve-Path test-home).Path
          Copy-Item official/horizon-launcher.exe test-install/horizon-launcher.exe
          [IO.File]::WriteAllText((Join-Path (Resolve-Path test-install) 'unknown.exe'), 'not a launcher')
          $exe = (Resolve-Path dist/HorizonPatcher.exe).Path
          $unknown = (Resolve-Path test-install/unknown.exe).Path
          $launcher = (Resolve-Path test-install/horizon-launcher.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList @('--apply', ('"' + $unknown + '"')) -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw 'Unknown file must be refused' }
          $p = Start-Process -FilePath $exe -ArgumentList @('--apply', ('"' + $launcher + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Patch failed on official fixture' }
          $applied = (Get-FileHash test-install/horizon-launcher.exe -Algorithm SHA256).Hash
          $expected = (Get-FileHash $env:UNCOMPRESSED_PAYLOAD -Algorithm SHA256).Hash
          if ($applied -ne $expected) { throw 'Installed file differs from built payload' }
          $unexpected = @(Get-ChildItem test-install -File | Where-Object { $_.Name -ne 'horizon-launcher.exe' -and $_.Name -ne 'unknown.exe' })
          if ($unexpected.Count -ne 0) { throw 'Patching left unexpected files alongside the launcher' }
      - name: Verify GUI subsystem and removal of old scheduled tasks
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist/HorizonPatcher.exe).Path
          $b = [IO.File]::ReadAllBytes($exe)
          $offset = [BitConverter]::ToInt32($b, 0x3c)
          if ($b[0] -ne 0x4d -or $b[1] -ne 0x5a -or [BitConverter]::ToUInt32($b, $offset) -ne 0x4550 -or [BitConverter]::ToUInt16($b, $offset + 24 + 68) -ne 2) { throw 'Patcher is not a Windows GUI-subsystem executable' }
          ./tests/scheduler-migration.ps1 -Patcher $exe -Official (Resolve-Path official/horizon-launcher.exe).Path
          ./tests/startup-update.ps1
      - name: Save tested launcher cache
        if: steps.prepare.outputs.publish == 'true' && steps.launcher-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: cached-launcher/horizon-launcher.exe
          key: ${{ steps.launcher-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.publish == 'true'
        with:
          name: tested-patcher
          path: dist/HorizonPatcher.exe
          retention-days: 2
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-patcher
          path: dist
      - name: Publish tested Windows executable
        run: |
          gh release create "$RELEASE_TAG" dist/HorizonPatcher.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest --title "$RELEASE_TAG" --notes "Automated build. See the repository README for compatibility and security limitations."
